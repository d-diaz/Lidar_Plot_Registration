[workspace]
name = "forest3d"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[environments]
dev = ["dev"]
cuda = ["cuda"]  # linux-only in practice
dev-cuda = ["dev", "cuda"]

# Runtime dependencies are declared once, in pyproject.toml, and installed through
# the editable forest3d entry below. List here only what must come from conda.
[dependencies]
python = ">=3.11,<3.14"
jupyter = "*"
pdal = "*"         # PDAL C++ library; no PyPI wheel
python-pdal = "*"  # satisfies the `pdal` requirement of the lidar extra

[pypi-dependencies]
forest3d = { path = ".", editable = true, extras = ["lidar"] }
jax = { extras = ["cpu"] }  # selects the CPU build; feature.cuda selects CUDA

[feature.cuda]
platforms = ["linux-64"]

[feature.cuda.pypi-dependencies]
jax = { extras = ["cuda13"] }

[feature.cuda.pypi-options]
index-url = "https://pypi.org/simple"
find-links = [{ url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html" }]

[feature.dev.dependencies]
ipykernel = "*"
mypy = "*"
nbval = "*"
pre-commit = "*"
pytest = "*"
pytest-benchmark = "*"
ruff = "*"

[tasks]
ruff-check = { cmd = "ruff check .", default-environment = "dev" }
ruff-format-check = { cmd = "ruff format --check .", default-environment = "dev" }
lint = { depends-on = ["ruff-format-check", "ruff-check"] }
typecheck = { cmd = "mypy", default-environment = "dev" }
test = { cmd = "pytest", default-environment = "dev" }
notebooks = { cmd = "pytest --nbval-lax --nbval-current-env notebooks", default-environment = "dev" }
bench = { cmd = "pytest benchmarks --benchmark-only", default-environment = "dev" }
ci = { depends-on = ["lint", "typecheck", "test", "notebooks"] }
