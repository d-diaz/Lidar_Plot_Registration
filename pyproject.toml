[project]
name = "forest3d"
version = "0.2.0"
description = "Methods for generating 3D models of forest inventory plots and co-registering plot data with canopy height rasters and point clouds."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "David Diaz" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
  "geopandas",
  "ipywidgets",
  "jax>=0.4.36",
  "k3d",
  "numpy",
  "numpyro",
  "pandas",
  "pandera>=0.24",
  "pydantic>=2",
  "pyproj",
  "rasterio",
  "scipy",
  "seaborn",
  "shapely",
]

[project.optional-dependencies]
# PDAL's Python bindings need the PDAL C++ library; install it via conda/pixi.
lidar = ["laspy[lazrs]", "pdal"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["forest3d", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
]

# Keep scientific code pragmatic; tighten over time.
ignore = [
]

exclude = [
  ".git",
  ".venv",
  "docs",
  "notebooks",
  "data",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 72

[tool.mypy]
python_version = "3.11"
files = ["forest3d"]

warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
warn_unreachable = true

ignore_missing_imports = true

# Avoid type-checking notebooks/docs (and keep visualization flexible initially).
exclude = [
  "(^docs/)",
  "(^notebooks/)",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["forest3d"]
